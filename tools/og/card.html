<!DOCTYPE html>
<!--
  TerraQuint share-card design (1200 x 630).
  Used by generate.mjs to create the image shown when an article is shared
  on LinkedIn / WhatsApp / X. Values are passed in the URL query string:
    ?cat=CASE%20STUDY&title=...&read=6%20min%20read&region=usa
-->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(fonts/Inter-Regular.woff2);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/Inter-SemiBold.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/Inter-Bold.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/Inter-ExtraBold.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;background:#111;color:#fff}
.card{position:relative;width:1200px;height:630px;background:#0d0d0d url(../../assets/globe/stars-tile.webp) repeat;background-size:512px}
.globe{position:absolute;right:-170px;top:-55px;width:740px;height:740px;opacity:.85}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#0d0d0d 0%,rgba(13,13,13,.96) 42%,rgba(13,13,13,.55) 70%,rgba(13,13,13,.15) 100%)}
.inner{position:absolute;left:72px;top:64px;bottom:64px;width:700px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:64px;height:64px}
.word{font-size:40px;font-weight:600;letter-spacing:-.01em}
.word b{color:#0077B6;font-weight:800}
.word span{color:#777;font-weight:400;font-size:28px}
.pill{display:inline-block;align-self:flex-start;margin-top:auto;font-size:16px;font-weight:700;letter-spacing:.12em;color:#6EB2FA;border:1.5px solid #6EB2FA;border-radius:30px;padding:7px 16px;text-transform:uppercase}
h1{font-size:54px;line-height:1.08;font-weight:700;letter-spacing:-.02em;margin-top:22px}
.foot{margin-top:28px;display:flex;gap:28px;font-size:20px;color:#cfcfcf}
.foot span:first-child{color:#6EB2FA;font-weight:600}
</style></head>
<body>
<div class="card">
  <img class="globe" id="globe" alt="">
  <div class="shade"></div>
  <div class="inner">
    <div class="brand"><img src="../../favicon.svg" alt=""><div class="word">Terra<b>Quint</b> <span>Insights</span></div></div>
    <span class="pill" id="cat"></span>
    <h1 id="title"></h1>
    <div class="foot"><span>terraquint.com</span><span>By Afaq Aslam</span><span id="read"></span></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('globe').src = 'globes/' + (q.get('region') || 'americas') + '.webp';
  document.getElementById('cat').textContent = q.get('cat') || '';
  document.getElementById('read').textContent = q.get('read') || '';
  const h = document.getElementById('title');
  const t = q.get('title') || '';
  h.textContent = t;
  if (t.length > 60) h.style.fontSize = '46px'; else if (t.length > 44) h.style.fontSize = '50px';
</script>
</body></html>
